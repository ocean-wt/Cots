[project]
name = "cots-backend"
version = "1.0.0"
description = "Cots — autonomous multi-agent platform (LangGraph supervisor engine, hybrid RAG, SSE)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # --- Agent engine ---
    "langgraph>=0.2,<2",
    "langgraph-checkpoint-mysql>=3.0,<4",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "langchain-anthropic>=0.2,<2",
    # --- Persistence (MySQL in docker / SQLite for local dev; same async SQLAlchemy core) ---
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    # pymysql 1.2.x removed the aiomysql bytes-escape shim, breaking binary
    # params (used by langgraph-checkpoint-mysql blobs). Keep <1.2.
    "pymysql<1.2",
    "cryptography>=43.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14",
    # --- Cache / durable async write queue / SSE resume ---
    "redis>=5.2",
    # --- Vector store: Milvus standalone in docker, milvus-lite embedded locally ---
    "pymilvus>=2.4.9,<2.5",
    "milvus-lite>=2.4.10,<2.5; platform_machine == 'x86_64' and sys_platform == 'linux'",
    # --- Real embedding model (BAAI/bge-small-zh-v1.5) served via ONNX Runtime ---
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    # --- Auth / misc ---
    "pyjwt>=2.10",
    "tiktoken>=0.8",
    "httpx>=0.27",
    # milvus-lite 2.4 imports pkg_resources at runtime
    "setuptools<81",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio==0.24.0",
    "anyio>=4.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
