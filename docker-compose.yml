name: cots

services:
  # ---------------------------------------------------------------- MySQL
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cots_root_dev}
      MYSQL_DATABASE: cots
      MYSQL_USER: cots
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cots_dev}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 8s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------- Redis
  redis:
    image: redis:7.2
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 8s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------- Milvus deps
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --------------------------------------------------------------- Milvus 2.4
  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      COMMON_STORAGETYPE: minio
      KNOWHERE_CACHE_PATH: /var/lib/milvus/cache
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      start_period: 90s
      retries: 20
    restart: unless-stopped

  # -------------------------------------------------------------- Backend
  backend:
    build:
      context: ./backend
    environment:
      ENV: docker
      DATABASE_URL: mysql+aiomysql://cots:${MYSQL_PASSWORD:-cots_dev}@mysql:3306/cots
      REDIS_URL: redis://redis:6379/0
      COTS_MILVUS_URI: http://milvus:19530
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      HF_ENDPOINT: https://hf-mirror.com
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      JWT_SECRET: ${JWT_SECRET:-cots-dev-only-change-me}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-cots-internal-dev-only}
      ALLOW_DEV_PRINCIPAL: "false"
      REQUIRE_INTERNAL_AUTH: "true"
      AGENT_MAX_ROUNDS: "2"
      AGENT_NODE_TIMEOUT_SEC: "60"
      SSE_IDLE_TIMEOUT_SEC: "45"
      SEED_ON_STARTUP: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - models_data:/app/data/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # --------------------------------------------------------------- Gateway
  gateway:
    build:
      context: ./gateway
    environment:
      GATEWAY_ADDR: ":8080"
      BACKEND_URL: http://backend:8000
      GATEWAY_JWT_SECRET: ${JWT_SECRET:-cots-dev-only-change-me}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-cots-internal-dev-only}
      GATEWAY_DEV_MODE: ${GATEWAY_DEV_MODE:-false}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SSE_IDLE_TIMEOUT_SEC: "45"
      UPSTREAM_TIMEOUT_SEC: "180"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------- Frontend
  frontend:
    build:
      context: ./frontend
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  models_data: